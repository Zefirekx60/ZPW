<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 9</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" 
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" 
        crossorigin="anonymous"></script>
        <script>
            $(function(){
                //Object event
                $(document).on("keydown keyup keypress", function(event){
                    $("#eventType").text(event.type);
                })

                $(document).on("mousemove", function(event){
                    $("#pageX").text(event.pageX);
                    $("#pageY").text(event.pageY);
                })

                let position = 0;
                let positionY = 0;

                $(document).on("keydown", function(){

                    if(event.key == "a"){
                        position = position -10
                        $("#kwadrat").css("margin-left", position+"px")
                    }

                    if(event.key == "d"){
                        position = position +10;
                        $("#kwadrat").css("margin-left", position+"px")
                    }
                    
                })

                $(document).on("keyup", function(){

                    if(event.key == "w"){
                        positionY = positionY -10
                        $("#kwadrat").css("margin-top", positionY+"px")
                    }

                    if(event.key == "s"){
                        positionY = positionY +10;
                        $("#kwadrat").css("margin-top", positionY+"px")
                    }
                    
                })


                $("#jablko").css({
                    "margin-left":Math.floor((Math.random()* 500)+1) + "px",
                    "margin-top":Math.floor((Math.random()* 500)+1) + "px"
                })



            })
        </script>

        <style>
            #kwadrat{
                width: 200px;
                height: 200px;
                background-color: red;
            }

            #jablko{
                width: 20px;
                height: 20px;
                background-color: green;
            }
        </style>
</head>
<body>
    <input type="text" id="pole">

    <p>Typ zdarzenia
        <span id="eventType">---</span>
    </p>

    <p>Pozycja myszy:
        X = <span id="pageX">---</span>,
        Y = <span id="pageY">---</span>
    </p>

    <div id="kwadrat"></div>

    <div id="jablko"></div>
    
</body>
</html>
