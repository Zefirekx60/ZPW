<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 12</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ30Ryrao="
    crossorigin="anonymous"></script>
    <script>
    $(function(){

        $("#kolor").change(function(){
            $("body").css("background-color", $(this).val())
        })

        $("#pizze").change(function(){
            $("#text").show().text("Do zapłaty: " + $(this).val() + " zł")
        })

        $("#newsletter").change(function(){
            if($(this).is(":checked")){
                $("#stan").text("Zapisano nas do newslettera")
            }else{
                $("#stan").text("Wypisano nas z newslettera")
            }
        })

        $("#check").change(function(){
            if($("#check").is(":checked")){
                $("#przycisk").prop("disabled", false)
            }else{
                $("#przycisk").prop("disabled", true)
            }
        })

        /* $("#rejestruj").prop("disabled", !$(this).is(":checked")) */

        $("#tekst").on("input", function(){
            $("#poglad").text($(this).val())
        })

        $("#pole").on("input", function(){
            let charLeft = 100 - $(this).val().length;

            $("#licznik").text(charLeft);

            if(charLeft <=10){
                $("#licznik").css("color", "red")
            }else{
                $("#licznik").css("color", "black")
            }

            /* $("#licznik").text(100 - $(this).val().length);
            if($("#licznik") == $("#pole").maxlength(10)){
                $("#licznik").css("background", "red") xDDD
            } */
        })

    })
    </script>
    <style>

    </style>
</head>
<body>
    <select id="kolor">
        <option value="white">Biały</option>
        <option value="yellow">Żółty</option>
        <option value="lightblue">Niebieski</option>
    </select>
    <hr>

    <select id="pizze">
        <option value="20">Mała</option>
        <option value="30">Średnia</option>
        <option value="40">Duża</option>
    </select>
    <p id="text"></p>
    <hr>

    <input type="checkbox" id="newsletter"> Chcę newsletter
    <p id="stan"></p>
    <hr>

    <input type="checkbox" id="check">Akceptuje regulamin <br>
    <input type="button" id="przycisk" value="Zarejestruj" disabled>
    <hr>

    <input type="text" id="tekst">
    <p>Pogląd: <span id="poglad"></span></p>
    <hr>

    <textarea id="pole" maxlength="100"></textarea>
    <p>Pozostało znaków: <span id="licznik">100</span></p>
    <hr>

</body>
</html>
